<div class="auth-container">
  <div class="auth-card">
    <div class="logo">
      <span class="logo-icon">🧠</span>
      <h1>SentioSync</h1>
      <p>Create your account</p>
    </div>
    <div class="error-box" *ngIf="errorMessage">⚠️ {{ errorMessage }}</div>
    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" formControlName="username" placeholder="yourname" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="min 8 characters" />
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" formControlName="password2" placeholder="repeat password" />
      </div>
      <button type="submit" class="btn-primary" [disabled]="isLoading">
        {{ isLoading ? 'Creating...' : 'Create Account →' }}
      </button>
    </form>
    <p class="switch-link">Already have an account? <a routerLink="/login">Login</a></p>
  </div>
</div>
