<div class="auth-container">
  <div class="auth-card">
    <div class="logo">
      <span class="logo-icon">🧠</span>
      <h1>SentioSync</h1>
      <p>AI-Powered Sentiment Analytics</p>
    </div>

    <div class="error-box" *ngIf="errorMessage">⚠️ {{ errorMessage }}</div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="you@example.com" />
        <span class="field-error" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Valid email required
        </span>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="••••••••" />
        <span class="field-error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Min 6 characters required
        </span>
      </div>
      <button type="submit" class="btn-primary" [disabled]="isLoading">
        {{ isLoading ? 'Logging in...' : 'Login →' }}
      </button>
    </form>

    <p class="switch-link">
      Don't have an account? <a routerLink="/signup">Sign up</a>
    </p>
  </div>
</div>
